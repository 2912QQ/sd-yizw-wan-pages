<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>龍哥 SD-WAN 控制台</title>
<style>
:root{color-scheme:dark;--bg:#050a14;--card:rgba(12,20,36,.92);--text:#e8eefc;--muted:#8794ad;--line:#1a2a44;--line2:#243a5e;--pri:#4d8dff;--pri-t:#fff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--field:#08101f;--code:#070d1a;--code-t:#cfe0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(900px 420px at 10% -8%,rgba(37,99,235,.30),transparent 62%),radial-gradient(700px 380px at 96% 0%,rgba(14,116,144,.18),transparent 62%),var(--bg);background-attachment:fixed}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.login{width:100%;max-width:360px;padding:30px;display:grid;gap:12px}
.login h1{margin:0;font-size:24px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--field);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
input[type=checkbox]{width:auto}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.inline{display:flex;gap:8px;align-items:center;color:var(--text)}
.btn{border:1px solid var(--line2);background:rgba(10,18,34,.7);color:#8fc1ff;padding:8px 15px;border-radius:10px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri);background:rgba(77,141,255,.12)}
.btn.pri{background:linear-gradient(180deg,#5b9bff,#3b6df0);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(59,109,240,.35)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.ghost{background:transparent;color:var(--text)}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.38)}
.btn.danger:hover{background:rgba(248,113,113,.12);border-color:var(--bad)}
.nctl .btn.pri{background:rgba(77,141,255,.16);border-color:var(--pri);color:#d4e6ff;box-shadow:none}
.err{color:var(--bad);margin:0;min-height:1em;font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px}
.hero h1{margin:0;font-size:26px;line-height:1.25;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero p{margin:4px 0 0}
.pill{font-size:12px;font-weight:400;color:var(--muted);padding:1px 9px;border:1px solid var(--line2);border-radius:99px;background:rgba(255,255,255,.03)}
.pill-btn{border-radius:99px;padding:9px 18px;color:#7db8ff;background:rgba(10,18,34,.8)}
.netbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}
#netList{display:flex;gap:8px;flex-wrap:wrap}
.net{cursor:pointer;display:inline-flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:10px;background:rgba(10,18,34,.7);box-shadow:none;border-color:var(--line2);color:#cfe0ff;transition:background .15s,border-color .15s}
.net:hover{border-color:var(--pri)}
.net.active{background:linear-gradient(180deg,#5b9bff,#3b6df0);border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(59,109,240,.4)}
.net b{font-size:14px;font-weight:600}
.net small{color:inherit;opacity:.7;font-size:12px}
.net .cnt{margin-left:8px;font-size:12px;font-weight:400;opacity:.75}
#netList .empty{padding:4px 0}
#detail{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.panel{padding:18px 14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:19px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.sw{position:relative;width:38px;height:22px;padding:0;border:1px solid var(--line2);border-radius:99px;background:#16233b;cursor:pointer;vertical-align:middle;transition:background .15s,border-color .15s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8794ad;transition:transform .15s,background .15s}
.sw.on{background:rgba(52,211,153,.22);border-color:var(--ok)}
.sw.on i{transform:translateX(16px);background:var(--ok)}
.sw:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px 18px}
.stat .n{font-size:30px;font-weight:700;line-height:1.25}
.stat .sub{font-size:12px;color:var(--muted)}
/* 节点列表：卡片式，自适应宽度，不再横向滚动 */
.nodes{display:grid;gap:10px}
.node{position:relative;display:grid;gap:12px;padding:14px 16px 14px 20px;border:1px solid var(--line);border-radius:14px;background:rgba(8,16,31,.6);overflow:hidden;transition:border-color .15s,background .15s}
.node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,#33415c)}
.node:hover{border-color:var(--line2);background:rgba(77,141,255,.06)}
.node.s-ok{--st:var(--ok)}.node.s-warn{--st:var(--warn)}.node.s-bad{--st:var(--bad)}.node.s-idle{--st:#475569}
.nh{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.nid{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;min-width:0}
.nname{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:16px}
.nname .tag{margin-left:0}
.nip{color:#9db4d8}
.nctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.nb{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.5fr) minmax(0,1.15fr) minmax(0,.6fr);gap:12px 24px;padding-top:12px;border-top:1px dashed var(--line)}
.node.off .nb{opacity:.5}
.f{min-width:0}
.f>.k{font-size:12px;color:var(--muted);margin-bottom:4px}
.f>.v{font-size:13px;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
.f>.v.mono{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
.chip{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:#cfe0ff}
.sw{flex:none}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.b-ok i{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
.b-warn i{background:var(--warn)}.b-warn{color:var(--warn)}
.b-bad i{background:var(--bad)}.b-bad{color:var(--bad)}
.pr{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;font-size:12px;line-height:1.7}
.pr b{font-weight:500}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(77,141,255,.16);border:1px solid rgba(77,141,255,.4);color:#a9ccff;margin-left:6px}
.notice{padding:11px 16px;border-radius:12px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.07);color:var(--warn);font-size:13px}
.geo{font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);margin-top:1px}
#qr{background:#fff;padding:10px;border-radius:8px;width:min(100%,262px);aspect-ratio:1/1;margin:4px auto;display:grid;place-items:center;overflow:hidden}
#qr canvas{display:none!important}
#qr img{display:block!important;width:100%!important;height:auto!important;aspect-ratio:1/1;image-rendering:pixelated}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line2);border-radius:18px;background:#0b1424;color:var(--text);padding:0;width:min(92vw,540px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(2,6,14,.72);backdrop-filter:blur(3px)}
dialog form,dialog .box{padding:22px;display:grid;gap:12px}
dialog .box{max-height:88vh;overflow-y:auto}
dialog h3{margin:0;font-size:18px}
.row{display:flex;gap:8px}.row.end{justify-content:flex-end}
pre{margin:0;background:var(--code);color:var(--code-t);padding:12px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16233b;color:var(--text);border:1px solid var(--line2);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1}
@media (max-width:1020px){.nb{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.wrap{padding:12px}.hero{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:14px 12px}}
@media (max-width:560px){.nb{grid-template-columns:minmax(0,1fr)}.nctl{width:100%;justify-content:space-between}.node{padding:12px 12px 12px 16px}}
</style>
</head>
<body>

<div id="login" class="center" hidden>
  <form class="card login" id="loginForm">
    <h1>龍哥 SD-WAN</h1>
    <p class="muted" style="margin:0">输入管理员账号登录控制台</p>
    <input type="text" id="un" placeholder="用户名" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input type="password" id="pw" placeholder="管理员密码" autocomplete="current-password" required>
    <button class="btn pri" type="submit">登录</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="card hero">
      <div>
        <h1>龍哥 SD-WAN 控制台 <span class="pill">v1.0.6</span></h1>
        <p class="muted"><span id="subtitle"></span> <button class="btn sm ghost" id="editSub" title="自定义这段说明文字">✎ 编辑</button></p>
      </div>
      <button class="btn pill-btn" id="logout">退出登录</button>
    </header>
    <nav class="card netbar">
      <span class="muted">当前网络</span>
      <div id="netList"></div>
      <button class="btn sm pri" id="addNet">＋ 新增网络</button>
    </nav>
    <section id="detail"></section>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let networks = [], nodes = [], curId = null, timer = null;

async function api(path, method = 'GET', body) {
  const r = await fetch('/api/admin' + path, {
    method, credentials: 'same-origin',
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('登录已过期，请重新登录'); }
  if (!r.ok) throw new Error((data && data.error) || 'HTTP ' + r.status);
  return data;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

function ago(ts) {
  if (!ts) return '从未';
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return Math.floor(d / 86400) + ' 天前';
}

function showLogin() { clearInterval(timer); $('#app').hidden = true; $('#login').hidden = false; ($('#un').value ? $('#pw') : $('#un')).focus(); }
function showApp() { $('#login').hidden = true; $('#app').hidden = false; }

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try {
    await api('/login', 'POST', { username: $('#un').value.trim(), password: $('#pw').value });
    $('#pw').value = '';
    await boot();
  } catch (err) { $('#loginErr').textContent = err.message; }
};
$('#logout').onclick = async () => { try { await api('/logout', 'POST'); } catch {} showLogin(); };

const DEFAULT_SUB = 'WireGuard 异地组网：节点状态、虚拟 IP、手机/电脑一键接入。';
let subtitle = DEFAULT_SUB;
function renderSub() { $('#subtitle').textContent = subtitle; }
async function loadSettings() {
  try { const s = await api('/settings'); subtitle = s.subtitle == null ? DEFAULT_SUB : s.subtitle; } catch {}
  renderSub();
}
$('#editSub').onclick = () => openForm('自定义说明文字', `
  <label>显示在标题下方的内容（留空则不显示，最多 100 字）<input name="subtitle" maxlength="100" value="${esc(subtitle)}" placeholder="例如：龍哥的专属异地组网"></label>
  <p class="muted" style="margin:0"><a href="#" id="resetSub">恢复默认文案</a></p>`, async (f) => {
  const r = await api('/settings', 'PUT', { subtitle: f.get('subtitle') || '' });
  subtitle = r.subtitle ?? ''; renderSub(); toast('已保存');
});
document.addEventListener('click', (e) => {
  if (e.target.id !== 'resetSub') return;
  e.preventDefault();
  const i = $('#dlg input[name=subtitle]'); if (i) i.value = DEFAULT_SUB;
});

async function boot() {
  try { await loadNetworks(); } catch { return showLogin(); }
  loadSettings();
  showApp();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && !$('#dlg').open) refresh(true); }, 15000);
}

async function loadNetworks() {
  networks = (await api('/networks')).networks;
  if (!networks.some((n) => n.id === curId)) curId = networks.length ? networks[0].id : null;
  renderNets();
  await loadNodes();
}

async function loadNodes() {
  nodes = curId ? (await api(`/networks/${curId}/nodes`)).nodes : [];
  renderDetail();
}

async function refresh(quiet) {
  try { await loadNetworks(); } catch (e) { if (!quiet) toast(e.message); }
}

function renderNets() {
  $('#netList').innerHTML = networks.length ? networks.map((n) => `
    <div class="card net ${n.id === curId ? 'active' : ''}" data-id="${n.id}">
      <b>${esc(n.name)}<span class="cnt">${n.online_count}/${n.node_count} 在线</span></b>
      <small class="mono">${esc(n.cidr)} · ${n.mode === 'hub' ? '中心辐射' : '优先直连'}</small>
    </div>`).join('') : '<div class="empty">还没有网络</div>';
}
$('#netList').onclick = (e) => {
  const el = e.target.closest('.net'); if (!el) return;
  curId = Number(el.dataset.id); renderNets(); loadNodes();
};

function statusBadge(n) {
  if (!n.enabled) return '<span class="badge b-bad"><i></i>已禁用</span>';
  if (n.is_client) {
    return n.online
      ? '<span class="badge b-ok" title="Hub 与该设备有新鲜的 WireGuard 握手"><i></i>客户端 · 已连接</span>'
      : '<span class="badge" title="Hub 上最近 3 分钟没有和该设备握手（手机没开隧道、或已休眠）"><i></i>客户端 · 未连接</span>';
  }
  if (!n.registered) return '<span class="badge b-warn"><i></i>待安装</span>';
  if (n.online && n.observed) {
    return '<span class="badge b-ok" title="该节点的 agent 没有同步控制面（可能连不上控制面域名，或 agent 已停止），但其他节点能和它建立 WireGuard 握手，隧道可用。请在该节点执行 meshlink-agent status 排查。"><i></i>在线<span class="muted">（仅隧道）</span></span>';
  }
  return n.online ? '<span class="badge b-ok"><i></i>在线</span>' : '<span class="badge"><i></i>离线</span>';
}

const NAT_LABEL = { public: '公网', cone: '锥形', symmetric: '对称', unknown: '未知' };

// 往返延迟: 越低越好，颜色只做提示
function rttHtml(ms) {
  if (ms === undefined || ms === null) return '<span class="muted">-</span>';
  const c = ms < 80 ? 'var(--ok)' : ms < 200 ? 'var(--warn)' : 'var(--bad)';
  return `<span class="mono" style="color:${c}">${ms} ms</span>`;
}

// 丢包率（agent 近 2 分钟内的探测包统计）：0 绿，<10% 黄，>=10% 红；旧版 agent 不上报则不显示
function lossHtml(pct) {
  if (pct === undefined || pct === null) return '';
  const c = pct === 0 ? 'var(--ok)' : pct < 10 ? 'var(--warn)' : 'var(--bad)';
  const w = pct >= 20 ? 700 : 400;
  return `<span class="mono" style="color:${c};font-weight:${w}" title="最近 2 分钟 ICMP 探测的丢包率">丢包 ${pct}%</span>`;
}

// NAT 类型 + 逐个对端的路径（d 直连 / p 尝试中 / r 经 Hub 中转）、IPv6/IPv4 和往返延迟
// 对端含 Hub；Hub 节点自己、中心辐射网络里也会列出到各对端的延迟
function pathCell(n, net) {
  if (!n.registered || !n.online) return '<span class="muted">-</span>';
  // 仅隧道在线: agent 没有同步控制面，它上报的 NAT / 路径是旧数据，不显示（其他节点那一行里能看到到它的路径和延迟）
  if (n.observed) return '<span class="muted" title="agent 连不上控制面，NAT 和路径数据已过期；到它的直连/延迟见其他节点的行">agent 未同步</span>';
  const nat = n.nat_type
    ? `<span class="badge ${n.nat_type === 'symmetric' ? 'b-warn' : ''}" title="STUN 探测到的 NAT 类型">${NAT_LABEL[n.nat_type] || '未知'}</span>` : '';
  const byId = new Map(nodes.map((x) => [x.id, x]));
  const live = (n.paths || []).filter((p) => byId.get(p.peer_id) && byId.get(p.peer_id).online);
  const STATE = {
    d: '<b style="color:var(--ok)">直连</b>',
    p: '<b class="muted">尝试中</b>',
    r: '<b style="color:var(--warn)" title="直连打不通，流量经 Hub 转发">中转</b>',
  };
  const FAM = { v6: '<span class="tag" style="margin:0" title="经 IPv6 直连">IPv6</span>', v4: '<span class="tag" style="margin:0" title="经 IPv4 直连">IPv4</span>' };
  const rows = live.filter((p) => p.state in STATE).map((p) => {
    const peer = byId.get(p.peer_id);
    return `<div class="pr"><span class="muted">${esc(peer.name)}${peer.is_hub ? '（Hub）' : ''}</span>${STATE[p.state]}${p.state === 'd' && p.family ? FAM[p.family] : ''}${p.state === 'p' ? '' : rttHtml(p.rtt) + lossHtml(p.loss)}</div>`;
  });
  const hint = net.mode === 'hub' && !rows.length ? ' <span class="muted">经 Hub</span>' : '';
  return nat + hint + rows.join('');
}

function renderDetail() {
  const net = networks.find((n) => n.id === curId);
  if (!net) { $('#detail').innerHTML = '<div class="card empty">点击左侧“新增”创建第一个虚拟网络</div>'; return; }
  const online = nodes.filter((n) => n.online).length;
  const pending = nodes.filter((n) => !n.registered).length;
  const noHub = net.mode !== 'hub' && !nodes.some((n) => n.is_hub && n.enabled);
  const symNodes = nodes.filter((n) => n.online && n.nat_type === 'symmetric').map((n) => n.name);
  const warn = noHub && symNodes.length
    ? `<div class="notice">节点 ${esc(symNodes.join('、'))} 位于对称 NAT 后面，与其他 NAT 后的节点基本无法直连，但本网络还没有 Hub，无法自动中转。请把一个有公网 IP 的节点设为 Hub（编辑节点 → 勾选“这是 Hub”，并放行其 UDP 监听端口）。</div>` : '';
  $('#detail').innerHTML = `
    <div class="card panel head">
      <div>
        <h2>${esc(net.name)}</h2>
        <div class="muted mono">${esc(net.cidr)} · ${net.mode === 'hub' ? '中心辐射（流量固定经 Hub 中转）' : '优先直连（打不通时自动经 Hub 中转）'}</div>
      </div>
      <div class="actions">
        <button class="btn sm" data-a="addNode">＋ 添加节点</button>
        <button class="btn sm" data-a="addClient">＋ 添加手机/电脑</button>
        <button class="btn sm" data-a="upgrade" title="控制面更新后，节点上的 agent 需要升级一次才有新功能（如出口节点）">升级命令</button>
        <button class="btn sm" data-a="allOn" ${nodes.length && nodes.every((n) => n.enabled) ? 'disabled' : ''} title="启用本网络的全部节点和手机/电脑">全部启用</button>
        <button class="btn sm" data-a="allOff" ${nodes.some((n) => n.enabled) ? '' : 'disabled'} title="停用本网络的全部节点和手机/电脑">全部停用</button>
        <button class="btn sm" data-a="editNet">编辑网络</button>
        <button class="btn sm danger" data-a="delNet">删除网络</button>
      </div>
    </div>
    ${warn}
    <div class="stats">
      <div class="card stat"><div class="muted">节点总数</div><div class="n">${nodes.length}</div><div class="sub">含 ${nodes.filter((n) => n.is_client).length} 台手机/电脑</div></div>
      <div class="card stat"><div class="muted">在线节点</div><div class="n" style="color:var(--ok)">${online}</div><div class="sub">agent 连接正常</div></div>
      <div class="card stat"><div class="muted">待安装</div><div class="n" style="color:var(--warn)">${pending}</div><div class="sub">等待执行安装命令</div></div>
      <div class="card stat"><div class="muted">Hub 节点</div><div class="n">${nodes.filter((n) => n.is_hub && n.enabled).length}</div><div class="sub">中转与手机/电脑接入</div></div>
    </div>
    <div class="card panel">
      ${nodes.length ? `<div class="nodes">${nodes.map((n) => nodeCard(n, net)).join('')}</div>`
        : '<div class="empty">还没有节点，点击“添加节点”开始组网</div>'}
    </div>`;
}

// 出口节点标记：被别人选作出口的节点显示“出口节点”；使用出口的节点显示“出口 → 名称”（出口离线时提示已回退本地出网）
function exitTag(n) {
  if (n.is_client) return '';
  if (n.exit_via) {
    const ex = nodes.find((x) => x.id === n.exit_via);
    if (!ex) return '';
    const live = ex.enabled && ex.online;
    return `<span class="tag" title="${live ? '该节点的全部外网流量经出口节点出去' : '出口节点当前离线/停用，已自动回退为本地出网'}">出口 → ${esc(ex.name)}${live ? '' : '（离线，本地出网）'}</span>`;
  }
  const users = nodes.filter((x) => x.exit_via === n.id);
  return users.length ? `<span class="tag" title="使用它出网的节点：${esc(users.map((x) => x.name).join('、'))}">出口节点 · ${users.length}</span>` : '';
}

function nodeCard(n, net) {
  const st = !n.enabled ? 's-bad' : n.is_client ? (n.online ? 's-ok' : 's-idle')
    : !n.registered ? 's-warn' : n.online ? 's-ok' : 's-idle';
  const field = (k, v, cls = '') => `<div class="f"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  const subs = (n.subnets || '').split(',').map((x) => x.trim()).filter(Boolean);
  const subHtml = subs.length ? `<div class="chips">${subs.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '<span class="muted">-</span>';
  const body = n.is_client ? '' : `<div class="nb">
      ${field('公网端点', epCell(n), 'mono')}
      ${field('NAT / 路径', pathCell(n, net))}
      ${field('内网网段', subHtml)}
      ${field('最后在线', n.registered ? ago(n.last_seen) : '-')}
    </div>`;
  const btns = n.is_client
    ? '<button class="btn sm pri" data-a="regen">重新生成配置</button><button class="btn sm" data-a="editClient">编辑</button><button class="btn sm danger" data-a="delNode">删除</button>'
    : `<button class="btn sm ${n.enroll_token ? 'pri' : ''}" data-a="install">${n.enroll_token ? '安装命令' : '命令'}</button><button class="btn sm" data-a="editNode">编辑</button><button class="btn sm ${n.exit_via ? 'pri' : ''}" data-a="exitNode" title="选择该节点的全部外网流量经哪个节点出去（出口 IP）">${n.exit_via ? '出口 IP ✓' : '出口 IP'}</button><button class="btn sm" data-a="reset">重置</button><button class="btn sm danger" data-a="delNode">删除</button>`;
  return `<article class="node ${st} ${n.enabled ? '' : 'off'}" data-id="${n.id}">
    <div class="nh">
      <div class="nid">
        <div class="nname"><b>${esc(n.name)}</b>${n.is_hub ? '<span class="tag">Hub</span>' : ''}${n.is_client ? '<span class="tag">手机/电脑</span>' : ''}${exitTag(n)}</div>
        <span class="mono nip">${esc(n.ip)}</span>
        ${statusBadge(n)}
      </div>
      <div class="nctl">
        <button class="sw ${n.enabled ? 'on' : ''}" role="switch" aria-checked="${n.enabled}" data-a="toggle" title="${n.enabled ? '点击停用' : '点击启用'}"><i></i></button>
        <div class="acts">${btns}</div>
      </div>
    </div>${body}
  </article>`;
}

$('#detail').onclick = async (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  const nodeId = b.closest('[data-id]') ? Number(b.closest('[data-id]').dataset.id) : null;
  const node = nodes.find((n) => n.id === nodeId);
  const net = networks.find((n) => n.id === curId);
  try {
    if (a === 'addNode') nodeForm();
    else if (a === 'addClient') clientForm();
    else if (a === 'upgrade') showUpgrade();
    else if (a === 'regen') await regenClient(node);
    else if (a === 'editNet') netForm(net);
    else if (a === 'delNet') {
      if (confirm(`确定删除网络“${net.name}”及其全部 ${nodes.length} 个节点？此操作不可恢复。`)) {
        await api(`/networks/${net.id}`, 'DELETE'); toast('已删除'); await loadNetworks();
      }
    }
    else if (a === 'install') showInstall(node);
    else if (a === 'editNode') nodeForm(node);
    else if (a === 'exitNode') exitForm(node);
    else if (a === 'editClient') clientEditForm(node);
    else if (a === 'allOn' || a === 'allOff') {
      const on = a === 'allOn';
      if (!on && !confirm(`停用“${net.name}”的全部 ${nodes.filter((n) => n.enabled).length} 台设备（含 Hub 和手机/电脑）？它们会立即从组网配置里移除，隧道在各节点下一次同步（≤ 1 分钟）后断开。可随时再点“全部启用”恢复。`)) return;
      const r = await api(`/networks/${net.id}/enabled`, 'PUT', { enabled: on });
      toast(on ? `已启用 ${r.changed} 台设备` : `已停用 ${r.changed} 台设备`); await refresh();
    }
    else if (a === 'toggle') { await api(`/nodes/${nodeId}`, 'PUT', { enabled: !node.enabled }); await refresh(); }
    else if (a === 'reset') {
      if (confirm(`重置“${node.name}”？旧凭证立即失效，节点会断开，需用新命令重新安装。`)) {
        await api(`/nodes/${nodeId}/reset`, 'POST'); await refresh();
        showInstall(nodes.find((n) => n.id === nodeId));
      }
    }
    else if (a === 'delNode') {
      if (confirm(`确定删除节点“${node.name}”？`)) { await api(`/nodes/${nodeId}`, 'DELETE'); toast('已删除'); await refresh(); }
    }
  } catch (err) { toast(err.message); }
};

function openForm(title, body, onSubmit, okText = '保存') {
  const d = $('#dlg');
  d.innerHTML = `<form><h3>${title}</h3>${body}<p class="err"></p>
    <div class="row end"><button type="button" class="btn ghost" data-close>取消</button><button class="btn pri">${okText}</button></div></form>`;
  const f = d.querySelector('form');
  f.onsubmit = async (e) => {
    e.preventDefault();
    try { await onSubmit(new FormData(f)); if (d.contains(f)) d.close(); } catch (err) { f.querySelector('.err').textContent = err.message; }
  };
  d.querySelector('[data-close]').onclick = () => d.close();
  d.showModal();
}

function netForm(net) {
  const edit = !!net;
  openForm(edit ? '编辑网络' : '新增虚拟网络', `
    <label>网络名称<input name="name" value="${esc(net?.name)}" required maxlength="40"></label>
    <label>网段 (CIDR)<input name="cidr" value="${esc(net?.cidr || '10.88.0.0/24')}" ${edit ? 'readonly' : ''} required class="mono"></label>
    <label>组网模式<select name="mode">
      <option value="mesh" ${net?.mode !== 'hub' ? 'selected' : ''}>优先直连 — 能直连就直连，打不通自动经 Hub 中转（推荐）</option>
      <option value="hub" ${net?.mode === 'hub' ? 'selected' : ''}>中心辐射 — 流量固定经公网 Hub 中转</option>
    </select></label>`, async (f) => {
    const body = { name: f.get('name'), cidr: f.get('cidr'), mode: f.get('mode') };
    if (edit) await api(`/networks/${net.id}`, 'PUT', body);
    else curId = (await api('/networks', 'POST', body)).id;
    toast('已保存'); await loadNetworks();
  });
}

function geoLine(info) {
  if (!info) return '';
  const text = [info.carrier, info.location].filter(Boolean).join(' · ');
  if (!text) return '';
  const tip = [info.isp && `ISP: ${info.isp}`, info.asn && `AS${info.asn}`, info.cc].filter(Boolean).join(' / ');
  return `<div class="geo" title="${esc(tip)}">${esc(text)}</div>`;
}

function epCell(n) {
  if (n.is_client) return '-';
  const tag = (t) => `<span class="tag" style="margin:0 6px 0 0">${t}</span>`;
  const rows = [];
  if (n.ipv4) rows.push(`<div>${tag('v4')}${esc(n.ipv4)}${geoLine(n.ipv4_info)}</div>`);
  if (n.ipv6) rows.push(`<div style="margin-top:4px">${tag('v6')}${esc(n.ipv6)}${geoLine(n.ipv6_info)}</div>`);
  // 节点在线却没有上报公网 IPv6：提示一下，节点之间只能走 IPv4（要排查就在节点上执行 meshlink-agent ipv6）
  if (!n.ipv6 && n.registered && n.online && !n.observed) {
    rows.push('<div class="muted" style="margin-top:4px;font-size:12px" title="该节点没有可用的公网 IPv6，节点之间只能走 IPv4。\n在节点上执行 meshlink-agent ipv6 可以看到原因（路由器没开 IPv6 / 只有内网 IPv6 地址等）。Docker 方式安装的执行 docker exec meshlink meshlink-agent ipv6。">IPv6：未检测到</div>');
  }
  return rows.length ? rows.join('') : '-';
}

// 编辑节点时选“出口节点”：只列本网络里的普通节点（中心辐射网络只能选 Hub）；已被别人用作出口的节点不能再选别的出口
function exitField(node) {
  if (!node || node.is_client) return '';
  const net = networks.find((x) => x.id === curId);
  const usedBy = nodes.filter((x) => x.exit_via === node.id);
  if (usedBy.length) {
    return `<div class="muted" style="font-size:12px;margin-top:8px">此节点正被 ${esc(usedBy.map((x) => x.name).join('、'))} 用作出口节点（会自动开启转发和 NAT），所以不能再选择别的出口。</div>`;
  }
  const hubOnly = net && net.mode === 'hub';
  const cands = nodes.filter((x) => !x.is_client && x.id !== node.id && !x.exit_via && (!hubOnly || x.is_hub));
  const opts = ['<option value="0">不使用（从本机网络直接出网）</option>']
    .concat(cands.map((x) => `<option value="${x.id}" ${x.id === node.exit_via ? 'selected' : ''}>${esc(x.name)}（${esc(x.ip)}）${x.online ? '' : ' · 离线'}</option>`));
  return `<label>出口节点（可选：该节点的全部外网流量经它出去，对外 IP 变成出口节点的公网 IP${hubOnly ? '；中心辐射网络只能选 Hub' : ''}）
      <select name="exit_via">${opts.join('')}</select></label>
    <div class="muted" style="font-size:12px">出口节点离线时会自动回退为本地出网；仅 IPv4。出口节点需要能转发（Linux 需 iptables，iStoreOS 需放行转发）。<b>使用方和出口节点的 agent 都要先升级</b>：<a href="#" data-upgrade style="color:var(--pri)">查看升级命令</a></div>`;
}

// 单独的“出口 IP”设置窗口（节点卡片上的“出口 IP”按钮）：选一个出口节点，该节点的全部外网流量经它出去
function exitForm(node) {
  if (!node || node.is_client) return;
  const usedBy = nodes.filter((x) => x.exit_via === node.id);
  if (usedBy.length) { toast(`“${node.name}”正被 ${usedBy.map((x) => x.name).join('、')} 用作出口节点，不能再选择别的出口`); return; }
  openForm(`出口 IP —“${esc(node.name)}”`, exitField(node), async (f) => {
    await api(`/nodes/${node.id}`, 'PUT', { exit_via: Number(f.get('exit_via') || 0) });
    toast('已保存，约 1 分钟内生效'); await refresh();
  }, '保存');
  const upg = $('#dlg').querySelector('[data-upgrade]');
  if (upg) upg.onclick = (e) => { e.preventDefault(); showUpgrade(); };
}

function nodeForm(node) {
  const edit = !!node;
  openForm(edit ? '编辑节点' : '添加节点', `
    <label>节点名称<input name="name" value="${esc(node?.name)}" required maxlength="40" placeholder="例如 office-sh"></label>
    <label>虚拟 IP（${edit ? '修改后节点会在 1 分钟内自动重建隧道；不能与其他节点重复' : '留空则自动分配'}）<input name="ip" class="mono" value="${esc(node?.ip)}" placeholder="例如 10.88.0.10"></label>
    <label>WireGuard 监听端口<input name="listen_port" type="number" min="1" max="65535" value="${node?.listen_port || 51820}"></label>
    <label class="inline"><input type="checkbox" name="is_hub" ${node?.is_hub ? 'checked' : ''}> 这是 Hub（有公网 IP，直连失败的节点会经它中转）</label>
    <label>该节点后面的内网网段（可选，逗号分隔）<input name="subnets" value="${esc(node?.subnets)}" placeholder="192.168.1.0/24" class="mono"></label>
    <label>手动指定对外地址（可选，默认用 STUN 自动探测的公网端点）<input name="endpoint_override" value="${esc(node?.endpoint_override)}" placeholder="vpn.example.com 或 1.2.3.4:51820" class="mono"></label>${exitField(node)}`,
  async (f) => {
    const body = {
      name: f.get('name'), ip: (f.get('ip') || '').trim(), listen_port: Number(f.get('listen_port')), is_hub: f.get('is_hub') === 'on',
      subnets: f.get('subnets') || '', endpoint_override: f.get('endpoint_override') || '',
    };
    if (edit && f.has('exit_via')) body.exit_via = Number(f.get('exit_via') || 0);
    if (edit) { await api(`/nodes/${node.id}`, 'PUT', body); toast('已保存'); await refresh(); }
    else {
      const id = (await api(`/networks/${curId}/nodes`, 'POST', body)).id;
      await refresh();
      showInstall(nodes.find((n) => n.id === id));
    }
  }, edit ? '保存' : '创建');
  const upg = $('#dlg').querySelector('[data-upgrade]');
  if (upg) upg.onclick = (e) => { e.preventDefault(); showUpgrade(); };   // 会替换当前对话框；未保存的修改需重新填写
}

// 升级 agent 的命令（和节点无关，只带本控制面地址）：控制面更新后，每台节点执行一次，新功能（如出口节点）才会生效
function showUpgrade() {
  const o = location.origin;
  const blocks = [
    {
      title: '升级 — Linux (systemd)',
      help: '在每台节点机器上以 root 执行一次。会更新 agent 和路径管理器并重启服务；隧道可能中断几秒。',
      cmd: `curl -fsSL ${o}/agent.sh | sudo bash -s -- upgrade`,
    },
    {
      title: '升级 — Docker / iStoreOS',
      help: '重启容器会重新下载最新版 agent，相当于升级。',
      cmd: 'docker restart meshlink',
    },
    {
      title: '确认出口是否生效（在使用出口的节点上执行）',
      help: '设置出口节点后等约 1 分钟同步，再执行；输出应是出口节点所在网络的公网 IP。Docker 节点把命令放到 <span class="mono">docker exec meshlink</span> 后面执行。',
      cmd: 'curl -4 -s --max-time 8 https://ifconfig.me; echo\nmeshlink-agent status',
    },
  ];
  const nums = '①②③④⑤';
  const d = $('#dlg');
  d.innerHTML = `<div class="box">
    <h3>升级节点 agent</h3>
    <p class="muted" style="margin:0">控制面更新后，使用方节点和出口节点都要各升级一次，“出口节点”等新功能才会生效（旧版 agent 不会建立出口路由 / NAT）。</p>
    ${blocks.map((x, i) => `<div style="display:grid;gap:6px">
      <div class="row" style="align-items:center;justify-content:space-between"><b>${nums[i]} ${x.title}</b><button class="btn sm" data-copy="${i}">复制</button></div>
      <p class="muted" style="margin:0;font-size:12.5px">${x.help}</p>
      <pre data-pre="${i}"></pre></div>`).join('')}
    <div class="row end"><button class="btn pri" data-close>完成</button></div></div>`;
  blocks.forEach((x, i) => { d.querySelector(`[data-pre="${i}"]`).textContent = x.cmd; });
  d.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(blocks[Number(btn.dataset.copy)].cmd); toast('已复制'); } catch { toast('请手动选中复制'); }
    };
  });
  d.querySelector('[data-close]').onclick = () => d.close();
  if (!d.open) d.showModal();
}

function showInstall(node) {
  if (!node || node.is_client) return;
  const o = location.origin;
  const pending = !!node.enroll_token;
  const dockerRun = (image) => `docker run -d --name meshlink --restart unless-stopped \\\n`
    + `  --network host --cap-add NET_ADMIN \\\n`
    + `  -e SERVER=${o} -e TOKEN=${node.enroll_token} \\\n`
    + `  -v /opt/meshlink:/etc/meshlink \\\n`
    + `  ${image} bash -c 'sed -i "s/deb.debian.org/mirrors.ustc.edu.cn/g" /etc/apt/sources.list.d/*\n`
    + `command -v curl >/dev/null || { apt-get update && apt-get install -y curl ca-certificates; }\n`
    + `curl -fsSL --retry 5 --retry-all-errors $SERVER/agent.sh -o /tmp/a.sh && bash /tmp/a.sh container'`;
  const blocks = [];
  if (pending) {
    blocks.push({
      title: '安装 — Linux (systemd)',
      help: '在该节点的 Linux 机器上以 root 执行（需要 systemd；会自动安装 wireguard-tools）。令牌一次性有效。',
      cmd: `curl -fsSL ${o}/agent.sh | sudo bash -s -- install --server ${o} --token ${node.enroll_token}`,
    });
    blocks.push({
      title: '安装 — Docker / iStoreOS',
      help: 'iStoreOS / OpenWrt / 任何带 Docker 的设备，SSH 登录后粘贴执行。前提：主机内核有 WireGuard 模块（<span class="mono">lsmod | grep wireguard</span>；没有就 <span class="mono">opkg install kmod-wireguard</span>）。软件包默认走中科大镜像，境外可把 mirrors.ustc.edu.cn 换成 deb.debian.org。凭证保存在 /opt/meshlink。iStoreOS 的防火墙（fw4）会由 agent 自动放行 meshlink 接口、转发和监听的 UDP 端口，不用再手动配置；Hub 在别的路由器后面时仍需在那台路由器上做端口转发。重装前先执行下方 Docker 卸载命令。',
      cmd: dockerRun('debian:bookworm-slim'),
    });
    blocks.push({
      title: 'Docker 拉取镜像失败 — 方法一：用加速站拉镜像',
      help: '如果报 <span class="mono">registry-1.docker.io … Client.Timeout exceeded</span>（连不上 Docker Hub）：先执行 <span class="mono">curl -sS -o /dev/null -w "%{http_code}\\n" https://docker.m.daocloud.io/v2/</span>，返回 200 或 401 就说明加速站可用，然后用下面这条（只是镜像名加了加速站前缀）。',
      cmd: dockerRun('docker.m.daocloud.io/library/debian:bookworm-slim'),
    });
    blocks.push({
      title: 'Docker 拉取镜像失败 — 方法二：给 Docker 配置全局镜像加速',
      help: '设备以后还要拉别的镜像时用这个（iStoreOS 的 Docker 设置页里也有“镜像加速”选项，填 https://docker.m.daocloud.io 即可）。配置好后，直接用上面“安装 — Docker / iStoreOS”那条命令。',
      cmd: 'mkdir -p /etc/docker\ncat > /etc/docker/daemon.json <<\'EOF\'\n{"registry-mirrors":["https://docker.m.daocloud.io"]}\nEOF\n/etc/init.d/dockerd restart',
    });
  }
  blocks.push({
    title: '管理 — Linux (systemd)',
    help: '节点安装后的常用命令（在节点机器上以 root 执行）。',
    cmd: '# 查看状态（含 NAT 类型、各对端直连/中转）\nmeshlink-agent status\n# 立即同步一次配置 / 单次 STUN 探测\nmeshlink-agent sync\nmeshlink-agent stun\n# 查看日志\njournalctl -u meshlink-agent -f\n# 升级 agent（控制面更新后执行一次）\ncurl -fsSL ' + o + '/agent.sh | sudo bash -s -- upgrade\n# 卸载（之后记得在后台删除该节点）\nmeshlink-agent uninstall',
  });
  blocks.push({
    title: '管理 — Docker / iStoreOS',
    help: '节点装在 Docker 里时用这些命令。',
    cmd: '# 查看日志（装依赖、注册、运行情况）\ndocker logs -f meshlink\n# 查看状态（含 NAT 类型、各对端直连/中转）\ndocker exec meshlink meshlink-agent status\n# 单次 STUN 探测\ndocker exec meshlink meshlink-agent stun\n# 重启（同时会重新下载最新版 agent，相当于升级）\ndocker restart meshlink\n# 卸载 / 重装前清理（之后记得在后台删除该节点）\ndocker rm -f meshlink && rm -rf /opt/meshlink',
  });
  const nums = '①②③④⑤⑥⑦⑧';
  const d = $('#dlg');
  d.innerHTML = `<div class="box">
    <h3>${pending ? '安装节点' : '节点命令'}“${esc(node.name)}”</h3>
    <p class="muted" style="margin:0">虚拟 IP: <span class="mono">${esc(node.ip)}</span>${pending ? '' : '　（节点已注册，安装令牌已失效；需要重新安装请先在列表里点“重置”）'}</p>
    ${blocks.map((x, i) => `<div style="display:grid;gap:6px">
      <div class="row" style="align-items:center;justify-content:space-between"><b>${nums[i]} ${x.title}</b><button class="btn sm" data-copy="${i}">复制</button></div>
      <p class="muted" style="margin:0;font-size:12.5px">${x.help}</p>
      <pre data-pre="${i}"></pre></div>`).join('')}
    <div class="row end"><button class="btn pri" data-close>完成</button></div></div>`;
  blocks.forEach((x, i) => { d.querySelector(`[data-pre="${i}"]`).textContent = x.cmd; });
  d.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(blocks[Number(btn.dataset.copy)].cmd); toast('已复制'); } catch { toast('请手动选中复制'); }
    };
  });
  d.querySelector('[data-close]').onclick = () => d.close();
  if (!d.open) d.showModal();
}

// ───────── 客户端设备（手机/电脑）：WireGuard 密钥在浏览器里生成，私钥不会上传 ─────────
const FP = (1n << 255n) - 19n;
const fm = (a) => ((a % FP) + FP) % FP;
function fpow(b, e) { let r = 1n; b = fm(b); while (e > 0n) { if (e & 1n) r = fm(r * b); b = fm(b * b); e >>= 1n; } return r; }
const leBig = (b) => { let x = 0n; for (let i = b.length - 1; i >= 0; i--) x = (x << 8n) | BigInt(b[i]); return x; };
function x25519(k, u) { // RFC 7748
  const kk = Uint8Array.from(k); kk[0] &= 248; kk[31] &= 127; kk[31] |= 64;
  const uu = Uint8Array.from(u); uu[31] &= 127;
  const s = leBig(kk), x1 = fm(leBig(uu));
  let x2 = 1n, z2 = 0n, x3 = x1, z3 = 1n, swap = 0n;
  for (let t = 254n; t >= 0n; t--) {
    const kt = (s >> t) & 1n; swap ^= kt;
    if (swap) { [x2, x3] = [x3, x2]; [z2, z3] = [z3, z2]; }
    swap = kt;
    const A = fm(x2 + z2), AA = fm(A * A), B = fm(x2 - z2), BB = fm(B * B), E = fm(AA - BB);
    const C = fm(x3 + z3), D = fm(x3 - z3), DA = fm(D * A), CB = fm(C * B);
    x3 = fm((DA + CB) ** 2n); z3 = fm(x1 * fm((DA - CB) ** 2n));
    x2 = fm(AA * BB); z2 = fm(E * fm(AA + 121665n * E));
  }
  if (swap) { [x2, x3] = [x3, x2]; [z2, z3] = [z3, z2]; }
  let v = fm(x2 * fpow(z2, FP - 2n));
  const out = new Uint8Array(32);
  for (let i = 0; i < 32; i++) { out[i] = Number(v & 255n); v >>= 8n; }
  return out;
}
const b64 = (u8) => btoa(String.fromCharCode(...u8));
function genKeyPair() {
  const priv = crypto.getRandomValues(new Uint8Array(32));
  priv[0] &= 248; priv[31] &= 127; priv[31] |= 64;
  const base = new Uint8Array(32); base[0] = 9;
  return { priv: b64(priv), pub: b64(x25519(priv, base)) };
}

// 手机的 MTU 固定 1280：蜂窝网络的外层 MTU 常常只有 1400 上下，1280 是 IPv6 的最小 MTU，任何路径都能过，
// 双向的 TCP 报文也因此都不会超过它，避免“能 ping 通但网页打不开”。
function clientConf(info, priv, v6) {
  return ['[Interface]', `PrivateKey = ${priv}`, `Address = ${info.ip}/32`, 'MTU = 1280', '',
    '[Peer]', `PublicKey = ${info.hub_public_key}`, `AllowedIPs = ${info.allowed_ips}`,
    `Endpoint = ${v6 && info.endpoint_v6 ? info.endpoint_v6 : info.endpoint}`, 'PersistentKeepalive = 25', ''].join('\n');
}

function showClientConf(name, info, priv) {
  const d = $('#dlg');
  const hasV6 = !!info.endpoint_v6;
  // Hub 有 IPv6 且当前浏览器所在的网络也有 IPv6（在手机上打开后台就是手机的网络）时默认走 IPv6
  let v6 = hasV6 && !!info.viewer_v6;
  let conf = '';
  const file = ('ml-' + (name.replace(/[^A-Za-z0-9_.-]/g, '') || 'client')).slice(0, 15) + '.conf';
  d.innerHTML = `<div class="box">
    <h3>“${esc(name)}”的接入配置</h3>
    <p class="muted" style="margin:0">手机：打开官方 WireGuard App → “+” → 扫描二维码。电脑：在 WireGuard 里“导入隧道”选择下载的 .conf 文件。
    <b>私钥只在这里显示这一次</b>（服务器不保存），关闭后如需重装请点“重新生成配置”。</p>
    ${hasV6 ? `<div class="row" style="align-items:center;flex-wrap:wrap">
      <button type="button" class="btn sm" data-fam="6">IPv6 接入</button>
      <button type="button" class="btn sm" data-fam="4">IPv4 接入</button>
      <span class="muted" id="famHint" style="font-size:12.5px"></span></div>` : ''}
    <div id="qr"></div>
    <pre id="cmd"></pre>
    <p class="muted" style="margin:0">虚拟 IP: <span class="mono">${esc(info.ip)}</span> · 接入 Hub: ${esc(info.hub_name)} (<span id="epText"></span>)</p>
    <div class="row end"><button class="btn" id="cp">复制配置</button><button class="btn" id="dl">下载 ${esc(file)}</button><button class="btn pri" data-close>完成</button></div></div>`;
  const draw = () => {
    conf = clientConf(info, priv, v6);
    d.querySelector('#cmd').textContent = conf;
    d.querySelector('#epText').textContent = v6 && hasV6 ? info.endpoint_v6 : info.endpoint;
    const qr = d.querySelector('#qr'); qr.innerHTML = '';
    try {
      new QRCode(qr, { text: conf, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
    } catch { qr.textContent = '二维码生成失败（二维码库未加载），请用下方的复制或下载'; }
    d.querySelectorAll('[data-fam]').forEach((b) => b.classList.toggle('pri', (b.dataset.fam === '6') === v6));
    const h = d.querySelector('#famHint');
    if (h) h.textContent = v6
      ? '不经过运营商 NAT，通常延迟和丢包更好；手机当前网络没有 IPv6 就连不上，请改选 IPv4。'
      : (info.viewer_v6 ? '' : '当前浏览器的网络没有检测到 IPv6；如果手机的网络有 IPv6，建议选 IPv6 接入。');
  };
  d.querySelectorAll('[data-fam]').forEach((b) => { b.onclick = () => { v6 = b.dataset.fam === '6'; draw(); }; });
  draw();
  d.querySelector('#cp').onclick = async () => {
    try { await navigator.clipboard.writeText(conf); toast('已复制'); } catch { toast('请手动选中复制'); }
  };
  d.querySelector('#dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([conf], { type: 'text/plain' }));
    a.download = file; document.body.appendChild(a); a.click(); a.remove();
  };
  d.querySelector('[data-close]').onclick = () => d.close();
  if (!d.open) d.showModal();
}

function clientForm() {
  openForm('添加手机/电脑', `
    <p class="muted" style="margin:0">用于不能跑 agent 的设备：手机、Windows/macOS 电脑等，通过官方 WireGuard App 接入，经本网络的 Hub 与所有节点互通。需要本网络里已有一个在线的 Hub。</p>
    <label>设备名称<input name="name" required maxlength="40" placeholder="例如 my-phone"></label>`, async (f) => {
    const name = f.get('name');
    const kp = genKeyPair();
    const info = await api(`/networks/${curId}/clients`, 'POST', { name, public_key: kp.pub });
    await refresh();
    showClientConf(name, info, kp.priv);
  }, '生成配置');
}

function clientEditForm(node) {
  openForm('编辑手机/电脑', `
    <label>设备名称<input name="name" value="${esc(node.name)}" required maxlength="40"></label>
    <label>虚拟 IP（修改后手机里的配置必须更新，保存后会提示重新生成；不能与其他设备重复）<input name="ip" class="mono" value="${esc(node.ip)}"></label>`, async (f) => {
    const name = (f.get('name') || '').trim(), ip = (f.get('ip') || '').trim();
    if (name === node.name && ip === node.ip) return;
    await api(`/nodes/${node.id}`, 'PUT', { name, ip });
    toast('已保存'); await refresh();
    if (ip !== node.ip) {
      setTimeout(async () => {
        if (confirm(`“${name}”的虚拟 IP 已改为 ${ip}。手机/电脑里旧配置的地址已经对不上，需要重新生成配置并重新导入。现在生成？`)) {
          try { await regenClient(nodes.find((n) => n.id === node.id), true); } catch (err) { toast(err.message); }
        }
      }, 50);
    }
  });
}

async function regenClient(node, skipConfirm) {
  if (!skipConfirm && !confirm(`重新生成“${node.name}”的配置？旧配置（旧密钥）立即失效，设备需要导入新配置。`)) return;
  const kp = genKeyPair();
  const info = await api(`/nodes/${node.id}/client`, 'PUT', { public_key: kp.pub });
  await refresh();
  showClientConf(node.name, info, kp.priv);
}

$('#addNet').onclick = () => netForm();
boot();
</script>
