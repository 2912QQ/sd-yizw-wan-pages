# MeshLink 节点（iStoreOS / 任意带 Docker 的设备）
# 使用前只改下面两个值：SERVER（你的 Pages 域名）和 TOKEN（后台“添加节点”后给出的令牌）
# 每台设备各用一个新节点、一个新令牌；令牌只能用一次，注册成功后会保存在 ./meshlink 目录里
#
# 前提：主机内核已有 WireGuard 模块（iStoreOS 上执行 lsmod | grep wireguard 能看到；
#       没有就先 opkg update && opkg install kmod-wireguard）

services:
  meshlink:
    image: debian:bookworm-slim
    container_name: meshlink
    restart: unless-stopped
    network_mode: host          # WireGuard 接口建在主机网络里
    cap_add:
      - NET_ADMIN               # 创建/配置 WireGuard 接口
    # 容器里解析不了控制面域名时（日志里反复出现 “Could not resolve host”，常见于 pages.dev 被本地 DNS 污染）：
    # 优先给控制面绑定自己的域名；临时办法是在这里把域名固定到一个能访问的 IP（在能解析的机器上 nslookup 得到）：
    # extra_hosts:
    #   - "你的域名:IP地址"
    environment:
      SERVER: "https://你的域名"
      TOKEN: "粘贴节点令牌"
    volumes:
      - ./meshlink:/etc/meshlink   # 私钥和节点凭证，务必持久化
    command:
      - bash
      - -c
      - |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        if ! command -v wg-quick >/dev/null 2>&1 || ! command -v nft >/dev/null 2>&1; then
          apt-get update
          # nftables: agent 用它在 iStoreOS/OpenWrt 的 fw4 防火墙里自动放行 WireGuard 接口和 UDP 端口
          apt-get install -y --no-install-recommends wireguard-tools iproute2 iptables nftables procps python3 curl ca-certificates hostname
        fi
        if [ ! -f /etc/meshlink/agent.env ]; then
          curl -fsSL "$$SERVER/agent.sh" | bash -s -- install --server "$$SERVER" --token "$$TOKEN"
        else
          # 容器被重建过：凭证还在，只需把 agent 程序重新下载回来
          curl -fsSL "$$SERVER/agent.sh" -o /usr/local/bin/meshlink-agent
          chmod 755 /usr/local/bin/meshlink-agent
          mkdir -p /usr/local/lib/meshlink
          curl -fsSL "$$SERVER/meshlink-path.py" -o /usr/local/lib/meshlink/meshlink-path.py || true
        fi
        exec /usr/local/bin/meshlink-agent run
